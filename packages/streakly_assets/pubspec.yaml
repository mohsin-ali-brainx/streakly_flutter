name: streakly_assets
description: Shared icons, images, and fonts for the Streakly app.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/icons/ic_welcome_stars.svg
    - assets/images/

